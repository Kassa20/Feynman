services:
  server:
    build:
      context: ./packages/server
    env_file:
      - ./packages/server/.env
    environment:
      PORT: 3000
    ports:
      - "3001:3000"

  client:
    build:
      context: ./packages/client
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        # Empty => same-origin requests to /api, proxied to the server by nginx.
        VITE_API_URL: ""
    environment:
      # Renders nginx.conf.template. 127.0.0.11 is Docker's embedded DNS.
      API_UPSTREAM: http://server:3000
      API_HOST: server
      DNS_RESOLVER: 127.0.0.11
    ports:
      - "8080:80"
    depends_on:
      - server
