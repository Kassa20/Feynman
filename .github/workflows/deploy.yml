name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys overlap; queue instead of cancelling, so a half-finished
# deploy is not abandoned mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT: feynman-504523
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/feynman-504523/my-app

jobs:
  # The server goes first: the client's nginx proxies /api/ to it, so the API
  # should never be older than the frontend calling it.
  server:
    name: Server — Cloud Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: packages/server
        run: |
          docker build \
            -t "$REGISTRY/server:$GITHUB_SHA" \
            -t "$REGISTRY/server:latest" \
            .
          docker push "$REGISTRY/server:$GITHUB_SHA"
          docker push "$REGISTRY/server:latest"

      # Deployed by immutable SHA tag, so a rollback is a redeploy of an older
      # tag. Env vars are deliberately not passed: omitting them leaves the
      # service's existing configuration (OPENAI_API_KEY, SUPABASE_*, LANGFUSE_*)
      # untouched. Change those in the Cloud Run console, not here.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy feynman-server \
            --image "$REGISTRY/server:$GITHUB_SHA" \
            --region "$REGION" \
            --project "$GCP_PROJECT" \
            --quiet

  client:
    name: Client — Cloud Run (nginx)
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Vite inlines VITE_* at build time, so they are Docker build args, not
      # runtime env. VITE_API_URL stays empty on purpose: nginx proxies /api/ to
      # the server, so the client calls its own origin.
      - name: Build and push image
        working-directory: packages/client
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            --build-arg VITE_API_URL="" \
            -t "$REGISTRY/client:$GITHUB_SHA" \
            -t "$REGISTRY/client:latest" \
            .
          docker push "$REGISTRY/client:$GITHUB_SHA"
          docker push "$REGISTRY/client:latest"

      # As above, no --set-env-vars: the service's API_UPSTREAM, API_HOST and
      # DNS_RESOLVER (which nginx.conf.template substitutes at container start)
      # are left as configured.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy feynman-client \
            --image "$REGISTRY/client:$GITHUB_SHA" \
            --region "$REGION" \
            --project "$GCP_PROJECT" \
            --quiet
